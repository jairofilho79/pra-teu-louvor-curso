<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="400" rx="24" fill="url(#bgGrad)" />
  
  <!-- Musical Staff lines -->
  <line x1="80" y1="140" x2="520" y2="140" stroke="#334155" stroke-width="2" />
  <line x1="80" y1="165" x2="520" y2="165" stroke="#334155" stroke-width="2" />
  <line x1="80" y1="190" x2="520" y2="190" stroke="#334155" stroke-width="2" />
  <line x1="80" y1="215" x2="520" y2="215" stroke="#334155" stroke-width="2" />
  <line x1="80" y1="240" x2="520" y2="240" stroke="#334155" stroke-width="2" />
  
  <!-- Sine Wave / Sound Wave -->
  <path d="M 80 190 C 130 110, 170 270, 220 190 C 270 120, 310 260, 360 190 C 410 130, 450 250, 520 190" 
        stroke="url(#waveGrad)" stroke-width="5" fill="none" stroke-linecap="round" />
        
  <!-- Glowing Notes -->
  <circle cx="220" cy="190" r="14" fill="#38bdf8" />
  <line x1="234" y1="190" x2="234" y2="130" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  
  <circle cx="360" cy="190" r="14" fill="#60a5fa" />
  <line x1="374" y1="190" x2="374" y2="130" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" />
  
  <!-- Treble Clef Stylized -->
  <circle cx="130" cy="220" r="8" fill="#93c5fd" />
  <path d="M 130 220 C 120 170, 160 130, 140 100 C 130 80, 120 110, 132 170 C 138 200, 130 270, 115 280 C 105 285, 100 275, 110 265" 
        stroke="#93c5fd" stroke-width="4" fill="none" stroke-linecap="round" />
        
  <!-- Text Badges -->
  <rect x="200" y="310" width="200" height="40" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="300" y="335" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">58 AULAS · 8 MÓDULOS</text>
</svg>
